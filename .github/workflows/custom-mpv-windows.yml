name: Fast Iterative mpv Build

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      mpv_ref:
        description: 'Branch, tag, or commit in the custom mpv repository'
        required: false
        default: master
        type: string

jobs:
  build:
    name: Build Windows executable (x86_64-v3)
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest

    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global pull.rebase true
          git config --global --add safe.directory "$PWD"

      - name: Check out build system
        uses: actions/checkout@v4
        with:
          ref: master

      # --- 1. CCACHE SETUP (Massive speedup for iterative C/C++ tweaks) ---
      - name: Install ccache
        run: pacman -Sy --noconfirm ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-x86_64-v3-${{ github.run_id }}
          restore-keys: |
            ccache-x86_64-v3-

      # --- 2. SOURCE & TOOLCHAIN CACHES ---
      - name: Restore downloaded sources cache
        uses: actions/cache/restore@v4
        with:
          path: src_packages
          key: src-packages-${{ github.run_id }}
          restore-keys: |
            src-packages-

      - name: Restore GCC toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: build_windows
          key: gcc-toolchain-x86_64-v3-${{ github.run_id }}
          restore-keys: |
            gcc-toolchain-x86_64-v3-

      - name: Configure Windows build (x86_64-v3)
        run: |
          # Added -DENABLE_CCACHE=ON
          cmake \
            -DTARGET_ARCH=x86_64-w64-mingw32 \
            -DGCC_ARCH=x86-64-v3 \
            -DMPV_REPOSITORY=https://github.com/kanav67/mpv.git \
            -DMPV_GIT_TAG=${{ inputs.mpv_ref }} \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
            -DENABLE_CCACHE=ON \
            -G Ninja \
            -B build_windows \
            -S "$PWD"

      - name: Download source packages
        run: ninja -C build_windows download || true

      - name: Build GCC toolchain
        run: ninja -C build_windows gcc

      # --- 3. INCREMENTAL BUILD EXECUTION ---
      # This explicitly tells the build system to pull your latest git commit
      - name: Update mpv source
        run: ninja -C build_windows mpv-update || true

      # This will now ONLY compile the files you changed since the last run!
      - name: Build mpv
        run: ninja -C build_windows mpv

      - name: Collect executables
        run: |
          mkdir -p artifact
          binary=$(find build_windows -type f -name mpv.exe -print -quit)
          
          if [ -z "$binary" ]; then
            echo "Error: mpv.exe was not found."
            exit 1
          fi
          
          cp "$binary" artifact/mpv.exe
          # Only copying mpv.exe to save upload time, add mkv.exe back if needed

      - name: Upload Error Logs
        if: failure() # This ensures it only runs if the build breaks
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs
          path: build_windows/packages/ngtcp2-prefix/src/ngtcp2-stamp/*.log

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: custom-mpv-windows-x86_64-v3
          path: artifact/
          compression-level: 1 # Fastest compression so the workflow ends sooner

      # --- 4. ROLLING CACHE SAVES ---
      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-x86_64-v3-${{ github.run_id }}

      - name: Save downloaded sources cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: src_packages
          key: src-packages-${{ github.run_id }}

      - name: Save GCC toolchain cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: build_windows
          key: gcc-toolchain-x86_64-v3-${{ github.run_id }}
