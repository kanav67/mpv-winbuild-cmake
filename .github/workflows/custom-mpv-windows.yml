name: Fast Iterative mpv Build

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      mpv_ref:
        description: 'Branch, tag, or commit in the custom mpv repository'
        required: false
        default: master
        type: string
      use_cache:
        description: 'Use cache (uncheck to force a clean build from scratch)'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build Windows executable (x86_64-v3)
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest

    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global pull.rebase true
          git config --global --add safe.directory "$PWD"

      - name: Check out build system
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install ccache
        # Added --disable-sandbox to fix Arch Linux pacman issues in Docker
        run: pacman -Sy --noconfirm --disable-sandbox ccache

      # --- CACHE RESTORES (Only run if use_cache is checked) ---
      - name: Restore ccache
        uses: actions/cache/restore@v4
        if: ${{ inputs.use_cache }}
        with:
          path: ~/.cache/ccache
          key: ccache-x86_64-v5-${{ github.run_id }}
          restore-keys: |
            ccache-x86_64-v5-

      - name: Restore downloaded sources cache
        uses: actions/cache/restore@v4
        if: ${{ inputs.use_cache }}
        with:
          path: src_packages
          key: src-packages-v5-${{ github.run_id }}
          restore-keys: |
            src-packages-v5-

      - name: Restore GCC toolchain cache
        uses: actions/cache/restore@v4
        if: ${{ inputs.use_cache }}
        with:
          path: build_windows
          key: gcc-toolchain-x86_64-v5-${{ github.run_id }}
          restore-keys: |
            gcc-toolchain-x86_64-v5-

      # --- BUILD EXECUTION ---
      - name: Configure Windows build (x86_64-v3)
        run: |
          cmake \
            -DTARGET_ARCH=x86_64-w64-mingw32 \
            -DGCC_ARCH=x86-64-v3 \
            -DMPV_REPOSITORY=https://github.com/kanav67/mpv.git \
            -DMPV_GIT_TAG=${{ inputs.mpv_ref }} \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
            -DENABLE_CCACHE=ON \
            -G Ninja \
            -B build_windows \
            -S "$PWD"

      - name: Download source packages
        run: ninja -C build_windows download || true

      - name: Build GCC toolchain
        run: ninja -C build_windows gcc

      - name: Force mpv git update
        # By removing this stamp file, we force the build system to pull 
        # your latest mpv commit without losing the compiled object files!
        run: rm -f build_windows/packages/mpv-prefix/src/mpv-stamp/mpv-update || true

      - name: Build mpv
        run: ninja -C build_windows mpv

      - name: Collect executables
        run: |
          mkdir -p artifact
          binary=$(find build_windows -type f -name mpv.exe -print -quit)
          
          if [ -z "$binary" ]; then
            echo "Error: mpv.exe was not found."
            exit 1
          fi
          
          cp "$binary" artifact/mpv.exe

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: custom-mpv-windows-x86_64-v3
          path: artifact/
          compression-level: 1

      # --- CACHE SAVES (Only save if use_cache is checked) ---
      - name: Save ccache
        uses: actions/cache/save@v4
        if: ${{ always() && inputs.use_cache }}
        with:
          path: ~/.cache/ccache
          key: ccache-x86_64-v5-${{ github.run_id }}

      - name: Save downloaded sources cache
        uses: actions/cache/save@v4
        if: ${{ always() && inputs.use_cache }}
        with:
          path: src_packages
          key: src-packages-v5-${{ github.run_id }}

      - name: Save GCC toolchain cache
        uses: actions/cache/save@v4
        if: ${{ always() && inputs.use_cache }}
        with:
          path: build_windows
          key: gcc-toolchain-x86_64-v5-${{ github.run_id }}
